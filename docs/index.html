    <script>
      (function() {
        // Ensure trailing slash on directories so relative assets ('./assets/...') always resolve correctly
        try {
          if (
            !location.pathname.endsWith('/') &&
            !location.pathname.split('/').pop().includes('.')
          ) {
            location.replace(location.pathname + '/' + location.search + location.hash);
            return;
          }
        } catch (e) {}

        try {
          const theme = localStorage.getItem('learner_passport_theme');
          const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CRYz_i68.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DJVrHHZ5.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        // Fallback: If GitHub Pages is configured to serve from "/ (root)" instead of "/docs",
        // the uncompiled TypeScript entry point cannot run directly on static hosting.
        // Automatically route to "/docs/" where the compiled production bundle is published.
        try {
          var isStaticHost = location.hostname.endsWith('github.io') || location.hostname.endsWith('github.dev');
          var isSourceFile = document.querySelector('script[src*="main.tsx"]');
          if (isStaticHost && isSourceFile && !location.pathname.includes('/docs')) {
            var target = location.pathname;
            if (!target.endsWith('/')) target += '/';
            location.replace(target + 'docs/' + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
